[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Must stay "no" so Render's env vars (DB_HOST, APP_KEY, etc.) reach Laravel.
clear_env = no

; Log worker errors to supervisord stdout for easier debugging.
catch_workers_output = yes

; Free-tier friendly: only spawn workers while there is traffic, so the
; 512MB instance doesn't keep 5 idle PHP processes resident.
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Kill a request that hangs instead of letting it consume the worker.
request_terminate_timeout = 120s
