services:
  - type: web
    name: dmms
    runtime: docker
    plan: free
    rootDir: .
    autoDeploy: true
    healthCheckPath: /up

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_NAME
        value: DMMS

      - key: APP_URL
        value: https://dmms-9g5f.onrender.com

      - key: APP_KEY
        sync: false


      - key: APP_LOCALE
        value: en

      - key: LOG_CHANNEL
        value: stderr

      - key: LOG_LEVEL
        value: info

      # Database (Neon PostgreSQL)
      - key: DB_CONNECTION
        value: pgsql

      - key: DB_HOST
        value: ep-holy-tooth-axqj6wsh-pooler.c-4.us-east-2.aws.neon.tech

      - key: DB_PORT
        value: "5432"

      - key: DB_DATABASE
        value: neondb

      - key: DB_USERNAME
        value: neondb_owner

      - key: DB_PASSWORD
        sync: false

      # Only run database seeds on boot when set to true (default off —
      # seeds are a one-time step to keep cold starts fast)
      - key: SEED_ON_START
        value: "false"

      - key: DB_SSLMODE
        value: require

      # Laravel
      - key: SESSION_DRIVER
        value: database

      - key: CACHE_STORE
        value: database

      - key: QUEUE_CONNECTION
        value: database

      - key: FILESYSTEM_DISK
        value: local

      - key: MAIL_MAILER
        value: log

      - key: VITE_APP_NAME
        value: DMMS