services:
  - type: web
    name: dmms
    runtime: docker
    plan: free
    rootDir: .
    autoDeploy: true
    healthCheckPath: /up

    envVars:
      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_NAME
        value: DMMS

      - key: APP_URL
        value: https://dmms-ccyw.onrender.com

      - key: APP_KEY
        sync: false


      - key: APP_LOCALE
        value: en

      - key: LOG_CHANNEL
        value: stderr

      - key: LOG_LEVEL
        value: info

      # Database (Render PostgreSQL — internal connection string is
      # injected automatically from the linked database below)
      - key: DB_CONNECTION
        value: pgsql

      - key: DATABASE_URL
        fromDatabase:
          name: dmms-db
          property: connectionString

      # Seeds a fresh/empty database automatically on first boot (see
      # docker/entrypoint.sh). Keep false — seeds are a one-time step.
      - key: SEED_ON_START
        value: "false"

      # Laravel
      - key: SESSION_DRIVER
        value: database

      - key: CACHE_STORE
        value: database

      - key: QUEUE_CONNECTION
        value: database

      - key: FILESYSTEM_DISK
        value: local

      - key: MAIL_MAILER
        value: log

      - key: VITE_APP_NAME
        value: DMMS

databases:
  - name: dmms-db
    plan: free